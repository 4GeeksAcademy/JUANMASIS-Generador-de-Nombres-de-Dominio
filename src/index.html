<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Generador de Dominios</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
  <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.2.0/css/all.css"
      integrity="sha384-hWVjflwFxL6sNzntih27bfxkr27PmbbK/iSvJ+a4+0owXq79v+lsFkW54bOGbiDQ"
      crossorigin="anonymous"
    />
</head>
<body>
  <main class="box">
    <img src="./assets/img/generator.png" alt="Generador" height="300">
    <h1>
        Generador de Dominios
    </h1>
    <p>
        Escribe un nombre (ej: <b>hola.com</b> o <b>hola</b>)
    </p>

    <input id="input-base" placeholder="Generar nombre de dominio aqui" />
    <div class="actions">
      <button id="btn-generate">Generar</button>
      <button id="btn-clear" class="ghost">Limpiar</button>
    </div>

    <pre id="output">(aquí verás los dominios)</pre>
    
  </main>
  <div class="footer mt-5 text-muted">
    Made with ❤️ by <a href="https://www.4geeksacademy.com">4Geeks Academy</a>
  </div>

  <script src="app.js"></script>
</body>
</html>
